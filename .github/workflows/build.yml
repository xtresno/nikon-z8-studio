name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    # Same steps as the README quick start, on a clean Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgphoto2-dev libjpeg-turbo8-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust build and tests
        run: cargo test --release
      - name: Web page
        working-directory: web
        run: npm install && npm run build
